<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />
	%sveltekit.head%
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
	<link rel="shortcut icon" href="/logo.jpg">
	<link rel="manifest" href="/manifest.json">
	<link href=" https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css " rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
    /* 1. Prvo default/light */
    :root {
        --bs-body-bg: #faf7ea9c;
        --bs-card-bg: #f8f8fa;
        --bs-border-color: #dcdcdf;
    }

    /* 2. Onda dark tema (mora biti POSLIJE da prepise light kad je aktivna) */
    [data-bs-theme="dark"] {
        --bs-body-bg: #2b2d31;
        --bs-body-color: #d4d4d8;
        --bs-border-color: #44464b;
        --bs-card-bg: #34363b;
        --bs-secondary-bg: #3a3c42;
        --bs-tertiary-bg: #3f4147;
    }

    /* OVDJE JE BILA GREŠKA: Umjesto fiksne boje, stavljamo varijablu */
    body {
        background-color: var(--bs-body-bg);
        color: var(--bs-body-color);
        min-height: 100vh;
        margin: 0;
    }

    /* 3. Reader ostaje uvijek isti */
    .reader-content {
        color: #2d2d2d !important;
    }
</style>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<script src=" https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js "></script>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>

</html>
